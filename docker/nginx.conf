server {
    listen 3000;
    server_name _;

    # TLS is terminated upstream (Apache on :443 in the current EC2 setup).
    # Trust the X-Forwarded-Proto header so $scheme reflects the original
    # client scheme rather than the container-internal "http".

    root /usr/share/nginx/html;
    index index.html;

    # Security headers — set at this layer so they are emitted even if the
    # upstream proxy (Apache) is misconfigured. Duplicating them is safe;
    # nginx will not double-send if Apache already added the same name.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options                 "nosniff"                   always;
    add_header X-Frame-Options                        "SAMEORIGIN"                 always;
    add_header Referrer-Policy                        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy                     "geolocation=(), microphone=(), camera=()" always;

    # TODO: add nginx-level rate limiting for /api/auth/* as defense-in-depth
    # on top of @fastify/rate-limit. The limit_req_zone directive must live in
    # the http{} block (see Dockerfile.frontend — add a sibling conf to
    # /etc/nginx/conf.d/rate-limit.conf) before a per-location limit_req can
    # be applied here.

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache static assets aggressively (Vite outputs content-hashed filenames)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy OAuth routes to the API
    location /auth/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Proxy all /api/* and /socket.io/* requests to the Fastify API
    location /api/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Socket.io (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass         http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
