<?xml version="1.0" encoding="UTF-8"?>
<!-- nextaibuilder favicon — Wise-themed spark mark (lime #9fe870 on warm-black #0e0f0c) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="32" height="32" role="img" aria-label="nextaibuilder">
  <rect width="56" height="56" rx="10" fill="#0e0f0c"/>
  <!-- cardinal rays -->
  <rect x="24" y="0"  width="8"  height="10" fill="#9fe870"/>
  <rect x="24" y="46" width="8"  height="10" fill="#9fe870"/>
  <rect x="0"  y="24" width="10" height="8"  fill="#9fe870"/>
  <rect x="46" y="24" width="10" height="8"  fill="#9fe870"/>
  <!-- diagonal rays -->
  <rect x="8"  y="8"  width="7" height="7" fill="#cdffad"/>
  <rect x="41" y="8"  width="7" height="7" fill="#cdffad"/>
  <rect x="8"  y="41" width="7" height="7" fill="#cdffad"/>
  <rect x="41" y="41" width="7" height="7" fill="#cdffad"/>
  <!-- mid ring -->
  <rect x="16" y="10" width="8" height="8" fill="#cdffad"/>
  <rect x="32" y="10" width="8" height="8" fill="#cdffad"/>
  <rect x="10" y="16" width="8" height="8" fill="#cdffad"/>
  <rect x="38" y="16" width="8" height="8" fill="#cdffad"/>
  <rect x="16" y="38" width="8" height="8" fill="#cdffad"/>
  <rect x="32" y="38" width="8" height="8" fill="#cdffad"/>
  <rect x="10" y="32" width="8" height="8" fill="#cdffad"/>
  <rect x="38" y="32" width="8" height="8" fill="#cdffad"/>
  <!-- inner ring -->
  <rect x="18" y="18" width="20" height="20" fill="rgba(159,232,112,0.18)"/>
  <rect x="20" y="20" width="16" height="16" fill="#9fe870"/>
  <rect x="22" y="22" width="12" height="12" fill="#163300"/>
  <!-- center pixel -->
  <rect x="24" y="24" width="8" height="8" fill="#ffffff"/>
</svg>
