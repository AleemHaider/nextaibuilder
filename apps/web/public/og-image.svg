<?xml version="1.0" encoding="UTF-8"?>
<!-- nextaibuilder Open Graph / Twitter preview card — 1200×630, navy/blue palette -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="nextaibuilder — AI product cohorts that ship">
  <!-- Navy gradient background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0d1a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative blobs -->
  <circle cx="1080" cy="540" r="340" fill="#4a9ad4" fill-opacity="0.14"/>
  <circle cx="120" cy="120" r="180" fill="#a8d4f0" fill-opacity="0.08"/>
  <circle cx="980" cy="130" r="90" fill="#ff8c5a" fill-opacity="0.12"/>

  <!-- Subtle grid -->
  <g stroke="#a8d4f0" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Spark mark top-left (56×56 scaled ×1.4 = 78) -->
  <g transform="translate(96, 88) scale(1.4)">
    <rect x="24" y="0"  width="8"  height="10" fill="#4a9ad4"/>
    <rect x="24" y="46" width="8"  height="10" fill="#4a9ad4"/>
    <rect x="0"  y="24" width="10" height="8"  fill="#4a9ad4"/>
    <rect x="46" y="24" width="10" height="8"  fill="#4a9ad4"/>
    <rect x="8"  y="8"  width="7" height="7" fill="#a8d4f0"/>
    <rect x="41" y="8"  width="7" height="7" fill="#a8d4f0"/>
    <rect x="8"  y="41" width="7" height="7" fill="#a8d4f0"/>
    <rect x="41" y="41" width="7" height="7" fill="#a8d4f0"/>
    <rect x="16" y="10" width="8" height="8" fill="#a8d4f0"/>
    <rect x="32" y="10" width="8" height="8" fill="#a8d4f0"/>
    <rect x="10" y="16" width="8" height="8" fill="#a8d4f0"/>
    <rect x="38" y="16" width="8" height="8" fill="#a8d4f0"/>
    <rect x="16" y="38" width="8" height="8" fill="#a8d4f0"/>
    <rect x="32" y="38" width="8" height="8" fill="#a8d4f0"/>
    <rect x="10" y="32" width="8" height="8" fill="#a8d4f0"/>
    <rect x="38" y="32" width="8" height="8" fill="#a8d4f0"/>
    <rect x="18" y="18" width="20" height="20" fill="#4a9ad4" fill-opacity="0.22"/>
    <rect x="20" y="20" width="16" height="16" fill="#4a9ad4"/>
    <rect x="22" y="22" width="12" height="12" fill="#1a2744"/>
    <rect x="24" y="24" width="8" height="8" fill="#ff8c5a"/>
  </g>

  <!-- NEXT pill -->
  <g transform="translate(220, 110)">
    <rect width="118" height="32" rx="16" fill="#4a9ad4" fill-opacity="0.20"/>
    <circle cx="16" cy="16" r="3" fill="#ff8c5a"/>
    <text x="30" y="21" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.5" fill="#a8d4f0">NEXT</text>
  </g>

  <!-- Wordmark -->
  <text x="96" y="330" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="-3" fill="#ffffff">nextaibuilder</text>

  <!-- Tagline -->
  <text x="96" y="410" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="700" fill="#ff8c5a">AI product cohorts that ship</text>

  <!-- Subtext -->
  <text x="96" y="478" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#ffffff" fill-opacity="0.72">Live and recorded cohorts to ship production AI products</text>
  <text x="96" y="512" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#ffffff" fill-opacity="0.72">with the Anthropic Claude API — prompts to pipelines.</text>

  <!-- URL footer -->
  <g transform="translate(96, 560)">
    <rect width="12" height="12" y="6" fill="#4a9ad4"/>
    <text x="24" y="16" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1" fill="#ffffff" fill-opacity="0.55">nextaibuilder.com</text>
  </g>
</svg>
