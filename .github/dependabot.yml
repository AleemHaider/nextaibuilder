# ─────────────────────────────────────────────────────────────────────────────
# Dependabot configuration — nextaibuilder (NAB)
#
# Scans weekly (Monday) for outdated dependencies and opens grouped PRs.
# Covers:
#   - Backend        (apps/api — Fastify)
#   - Frontend apps/web        (workspace member — Vite + React)
#   - Frontend nextaibuilder-app (standalone Vite + React app used by CI)
#   - GitHub Actions workflow updates (/)
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# ─────────────────────────────────────────────────────────────────────────────
version: 2
updates:
  # Backend (Fastify API)
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      production-deps:
        dependency-type: "production"
        patterns:
          - "*"
      dev-deps:
        dependency-type: "development"
        patterns:
          - "*"

  # Frontend — apps/web (workspace member)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      production-deps:
        dependency-type: "production"
        patterns:
          - "*"
      dev-deps:
        dependency-type: "development"
        patterns:
          - "*"

  # Frontend — nextaibuilder-app (standalone app used in CI)
  - package-ecosystem: "npm"
    directory: "/nextaibuilder-app"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      production-deps:
        dependency-type: "production"
        patterns:
          - "*"
      dev-deps:
        dependency-type: "development"
        patterns:
          - "*"

  # GitHub Actions workflow updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
