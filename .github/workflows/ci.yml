# ─────────────────────────────────────────────────────────────────────────────
# nextaibuilder — CI: Lint, Type-check & Test
# FIR-27
#
# Runs on every PR and push to main.
# Does NOT deploy — deployment is handled by ci-cd.yml on merge to main.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci-api:
    name: API — Lint, Typecheck & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/nextaibuilder_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-minimum-32-chars-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars-long
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_REGION: us-east-1
          S3_BUCKET_NAME: test-bucket
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          FRONTEND_URL: http://localhost:3000

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval \"db.adminCommand('ping').ok\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  # ───────────────────────────────────────────────────────────────────────────
  # Security Audit — scans production deps for known CVEs on both the API
  # and the frontend. Runs in parallel with the API lint/typecheck/test job
  # so a vuln doesn't block visibility into those results.
  # ───────────────────────────────────────────────────────────────────────────
  security-audit:
    name: Security Audit (npm audit)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Security audit (backend)
        working-directory: apps/api
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false   # fail the build on high/critical

      - name: Security audit (frontend — nextaibuilder-app)
        working-directory: nextaibuilder-app
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false   # fail the build on high/critical
