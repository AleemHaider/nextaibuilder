<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="104" fill="#1a2744"/>
  <!-- Spark mark centered at 256,256 scaled to ~300px (scale ≈ 5.36×56) -->
  <!-- cardinal rays -->
  <rect x="228" y="128" width="56" height="64" fill="#4a9ad4"/>
  <rect x="228" y="320" width="56" height="64" fill="#4a9ad4"/>
  <rect x="128" y="228" width="64" height="56" fill="#4a9ad4"/>
  <rect x="320" y="228" width="64" height="56" fill="#4a9ad4"/>
  <!-- diagonal rays -->
  <rect x="164" y="164" width="46" height="46" fill="#7dcbff"/>
  <rect x="302" y="164" width="46" height="46" fill="#7dcbff"/>
  <rect x="164" y="302" width="46" height="46" fill="#7dcbff"/>
  <rect x="302" y="302" width="46" height="46" fill="#7dcbff"/>
  <!-- mid ring -->
  <rect x="210" y="164" width="46" height="46" fill="#5ab4e8"/>
  <rect x="256" y="164" width="46" height="46" fill="#5ab4e8"/>
  <rect x="164" y="210" width="46" height="46" fill="#5ab4e8"/>
  <rect x="302" y="210" width="46" height="46" fill="#5ab4e8"/>
  <rect x="210" y="302" width="46" height="46" fill="#5ab4e8"/>
  <rect x="256" y="302" width="46" height="46" fill="#5ab4e8"/>
  <rect x="164" y="256" width="46" height="46" fill="#5ab4e8"/>
  <rect x="302" y="256" width="46" height="46" fill="#5ab4e8"/>
  <!-- inner ring -->
  <rect x="210" y="210" width="92" height="92" fill="rgba(74,154,212,0.18)"/>
  <rect x="220" y="220" width="72" height="72" fill="#4a9ad4"/>
  <rect x="232" y="232" width="48" height="48" fill="#7dcbff"/>
  <!-- center pixel — warm orange energy accent -->
  <rect x="240" y="240" width="32" height="32" fill="#ff8c5a"/>
</svg>
