<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — nextaibuilder</title>
  <style>
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #f8f9fb;
      color: #1a2744;
      text-align: center;
      margin: 0;
    }
    .card {
      padding: 48px 40px;
      background: white;
      border-radius: 24px;
      box-shadow: rgba(26,39,68,0.12) 0 0 0 1px, 0 8px 32px rgba(26,39,68,0.08);
      max-width: 380px;
      width: calc(100% - 40px);
    }
    h1 { font-size: 48px; margin-bottom: 16px; }
    h2 { font-size: 22px; font-weight: 800; color: #1a2744; margin-bottom: 8px; }
    p { font-size: 15px; color: #717182; line-height: 1.5; margin-bottom: 24px; }
    button {
      padding: 13px 28px;
      background: #4a9ad4;
      color: #0d1a3a;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📶</h1>
    <h2>You're offline</h2>
    <p>Check your internet connection and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
