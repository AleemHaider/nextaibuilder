# nextaibuilder — Host-level Nginx configuration (EC2 bare-metal / PM2 deployment)
# FIR-81
#
# This config is for the Nginx process running directly on the EC2 host,
# NOT the Nginx container used in the Docker Compose stack (docker/nginx.conf).
#
# Installed by: sudo bash infra/nginx-setup.sh
# Location on server: /etc/nginx/sites-available/nextaibuilder

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name nextaibuilder.com www.nextaibuilder.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nextaibuilder.com www.nextaibuilder.com;

    # SSL certificates — managed by Certbot (infra/certbot-setup.sh)
    ssl_certificate /etc/letsencrypt/live/nextaibuilder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nextaibuilder.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    # CSP is handled at the application layer (Fastify helmet) to stay flexible
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Increased body size limit for receipt/file uploads (see FIR-87 AWS_S3_BUCKET)
    client_max_body_size 12m;

    # Serve React SPA static files
    root /var/www/nextaibuilder/apps/web/dist;
    index index.html;

    # API proxy — forward all /api/* requests to the Fastify process (port 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Socket.IO WebSocket proxy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA fallback — serve index.html for all non-API, non-asset routes
    # Required for React Router client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching — Vite outputs content-hashed filenames so 1y is safe
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
